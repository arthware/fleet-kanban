name: CI

on:
  push:
    branches: [main, production-line, "epic/**"]
  pull_request:
    branches: [main, production-line, "epic/**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

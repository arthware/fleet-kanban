name: Test

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-check-test:
    name: Build, Lint, and Test (Ubuntu, Node 22)
    timeout-minutes: 10
    runs-on: ubuntu-latest

    # Tests run under an isolated $HOME (test/setup/isolated-home.ts), so `git config --global`
    # (which writes $HOME/.gitconfig) never reaches them. Git identity via env vars is
    # HOME-independent, so temp-repo commits inside tests succeed.
    env:
      GIT_AUTHOR_NAME: fleet ci
      GIT_AUTHOR_EMAIL: ci@fleet.local
      GIT_COMMITTER_NAME: fleet ci
      GIT_COMMITTER_EMAIL: ci@fleet.local

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Web UI Dependencies
        run: npm ci --prefix web-ui

      # Configuring a global git identity is required because some fast tests
      # query git history, verify workspace post-create hooks, or commit to mock/temp repositories.
      - name: Configure Git Identity
        run: |
          git config --global user.email "ci@fleet.local"
          git config --global user.name "fleet ci"

      - name: Verify
        run: npm run verify
